<div class="container-fluid">
<div class="row-fuild span12">
		  <form id="resultSearch" name="search">
               
                    <span class="input-append">
                       <input id="indexSearchText" type="text" class="span10 visual_search" placeholder="<%=search%>">
                       <button id="search" class="btn btn-primary">Search</button>
                	</span>                       
            </form>
</div>
  
  
  
  <div class="row-fluid span12">
    <div class="span12" id="examples-content">
     
    <div id="solution"> 
    <div class="text-info"><h3><%=description%> <% if(editable) { %><i id="edit" class="icon-edit"/><% } %></i> <div class="pull-right"><button id="back-search-results" class="btn btn-info btn-mini">Results</button> <button id="new" class="btn btn-success btn-mini">New Solution</button></div> </h3> </div>
    
           <%=solution%>
    </div>   
    <div class="text-info pull-right"><h4><%=reference.name%> <small>solution</small></h4><small><%=formattedUserDate%></small></div>
    <div id="tags" class="text-info"></div>
    <div style="clear: both;border-bottom: 1px dashed #666666;padding: 10px 4px;"><strong>Comments</strong></div>
    
    
    <div class="row-fluid">
        <div class="span6 offset2" id="example-comments">
        
        
        </div>
    </div>
    
   </div>
  </div>
