  <div class="row" id="command">
	<div class="span12">
		<div id="tab-pane-refs" class="span7 offset1">
		 <form class="form-horizontal">
			<div id="name-input" class="control-group">
			<div class="text-info">
  
					<input type="text" id="name"  autofocus="autofocus"/>  
					<span id="name-error" class="help-inline"></span>
			
			</div>
			</div>
		   <div id="description-input" class="control-group">		
			<p>
				<strong>Description:</strong><br />
			    <textarea id="description-text"></textarea>
			    <span id="description-error" class="help-inline"></span>
			</p>
			</div>
			<p>
				<strong>Options:</strong><br />
			    <textarea id="options-text"></textarea>
			</p>
			<p>
				<strong>Example:</strong><br />
			    <textarea id="example-text">
			   
			    </textarea>
			</p>
			<br />


			 <button class="btn btn-small btn-primary" id="save">Save</button>
             <button class="btn btn-small btn-cancel" id="cancel">Cancel</button>
         
           </form>  
		</div>
	</div>
</div>
