
<div class="row">
	<div class="span12">
		<div id="tab-pane-refs" class="span7 offset1">
			<div class="text-info">
				<h3>
					<%=name%> <i class="icon-edit" id="edit-command"></i>
				</h3>
			</div>
			<p>
				<strong>Description:</strong><br />
			<blockquote><%=description%></blockquote>
			</p>
			<p>
				<strong>Options:</strong><br />
			<blockquote><%=options%></blockquote>
			</p>
			<p>
				<strong>Example:</strong><br />
			<blockquote><%=example%></blockquote>
			</p>
			<br />

			<div class="text-info pull-right">
				<a href="#" id="command-hist"><small><%=formattedDateTime%></small></a>
			</div>


			  <div class="row-fluid">
       		 <div class="span6 offset2">
            	<div style="padding: 8px 8px" id="hist_content">
             </div>
		</div>
	</div>
</div>
